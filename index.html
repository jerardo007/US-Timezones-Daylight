<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>US Time Zones + Live Daylight</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{height:100%;margin:0;background:#0b0f14;}
#map{width:100%;height:100vh;}
.leaflet-control.attribution{display:none;}

.panel{
background:rgba(20,24,28,.92);
color:#e8eef7;
padding:.6rem .8rem;
border-radius:.75rem;
box-shadow:0 6px 18px rgba(0,0,0,.35);
font:14px system-ui;
}

.legend .row{
display:flex;
align-items:center;
gap:.5rem;
margin:.25rem 0;
}

.chip{
width:14px;
height:14px;
border-radius:3px;
border:1px solid rgba(255,255,255,.15);
}

.clock .row{
display:flex;
justify-content:space-between;
gap:1rem;
}

.toggle label{display:block;margin:.18rem 0;}

.credit{
position:absolute;
bottom:8px;
right:10px;
z-index:400;
background:rgba(20,24,28,.85);
color:#a8b3bf;
padding:4px 8px;
border-radius:8px;
font:12px system-ui;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="credit">
Built with <a href="https://leafletjs.com/" target="_blank">Leaflet</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map",{zoomControl:true,worldCopyJump:true})

/* Basemap providers */

const PROVIDERS=[
{
key:"OSM Light",
layer:L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:7,minZoom:2}
)
},

{
key:"Esri Light Gray",
layer:L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
{maxZoom:7,minZoom:2}
)
},

{
key:"Carto Light",
layer:L.tileLayer(
"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
{maxZoom:7,minZoom:2,subdomains:"abcd"}
)
},

{
key:"Esri Dark Gray",
layer:L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
{maxZoom:7,minZoom:2}
)
}
]

function useProvider(i){
PROVIDERS.forEach(p=>map.removeLayer(p.layer))
PROVIDERS[i].layer.addTo(map)
}

/* Default basemap = ESRI DARK */

useProvider(3)

map.setView([39.5,-98.35],4)

/* Timezone polygons */

function rect(w,e,s,n){
return[
[s,w],
[s,e],
[n,e],
[n,w],
[s,w]
]
}

const SOUTH=24
const NORTH=49.5

const zones=[

{key:"PT",name:"Pacific",tz:"America/Los_Angeles",color:"#fb9a99",poly:rect(-125,-114,SOUTH,NORTH)},
{key:"MT",name:"Mountain",tz:"America/Denver",color:"#fdbf6f",poly:rect(-114,-103.5,SOUTH,NORTH)},
{key:"CT",name:"Central",tz:"America/Chicago",color:"#cab2d6",poly:rect(-103.5,-90.5,SOUTH,NORTH)},
{key:"ET",name:"Eastern",tz:"America/New_York",color:"#ffff99",poly:rect(-90.5,-66.9,SOUTH,NORTH)}

]

const tzLayer=L.layerGroup()

zones.forEach(z=>{

L.polygon(z.poly,{
color:"#9aa4ad",
weight:1,
opacity:.6,
fillColor:z.color,
fillOpacity:.28
})
.bindTooltip(`<b>${z.name}</b><br>${z.key}`)
.addTo(tzLayer)

})

tzLayer.addTo(map)

/* CLOCK */

const clock=L.control({position:"topright"})

clock.onAdd=function(){

const div=L.DomUtil.create("div","panel clock")

div.innerHTML=`
<div class="row"><span>ET</span><span id="tET"></span></div>
<div class="row"><span>CT</span><span id="tCT"></span></div>
<div class="row"><span>MT</span><span id="tMT"></span></div>
<div class="row"><span>PT</span><span id="tPT"></span></div>
`

return div
}

clock.addTo(map)

function fmt(tz){
return new Date().toLocaleTimeString(
[],
{timeZone:tz}
)
}

function tick(){

tET.textContent=fmt("America/New_York")
tCT.textContent=fmt("America/Chicago")
tMT.textContent=fmt("America/Denver")
tPT.textContent=fmt("America/Los_Angeles")

}

tick()
setInterval(tick,1000)

/* LEGEND */

const legend=L.control({position:"bottomleft"})

legend.onAdd=function(){

const div=L.DomUtil.create("div","panel legend")

div.innerHTML=`
<div class="row"><span class="chip" style="background:#fb9a99"></span>Pacific</div>
<div class="row"><span class="chip" style="background:#fdbf6f"></span>Mountain</div>
<div class="row"><span class="chip" style="background:#cab2d6"></span>Central</div>
<div class="row"><span class="chip" style="background:#ffff99"></span>Eastern</div>
`

return div
}

legend.addTo(map)

/* METEOR LOGO CONTROL */

const logo=L.control({position:"topleft"})

logo.onAdd=function(){

const div=L.DomUtil.create("div")

div.style.marginLeft="50px"
div.style.marginTop="10px"

div.innerHTML=`
<img src="Meteor Symbol curves red.png"
style="
width:70px;
opacity:.9;
pointer-events:none;
filter:drop-shadow(0 0 10px rgba(255,0,0,.7));
">
`

return div
}

logo.addTo(map)

</script>

</body>
</html>
