<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>US Time Zones + Live Daylight</title>

  <!-- Leaflet CSS (2 sources; either one can load) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" onload="this.rel='stylesheet'">

  <style>
    html, body { height: 100%; margin: 0; background:#0b0f14; }
    #map { width: 100%; height: 100vh; }
    .leaflet-control.attribution { display:none; }
    .panel { background: rgba(20,24,28,.92); color:#e8eef7; padding:.6rem .8rem; border-radius:.75rem; box-shadow:0 6px 18px rgba(0,0,0,.35); font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .legend h4 { margin:0 0 .5rem; font-size:14px; }
    .legend .row { display:flex; align-items:center; gap:.5rem; margin:.25rem 0; }
    .chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); }
    .clock h4 { margin:0 0 .4rem; font-weight:600; font-size:14px; opacity:.9; }
    .clock .row { display:flex; justify-content:space-between; gap:1rem; }
    .toggle label { display:block; margin:.18rem 0; }
    .status { position:absolute; top:8px; left:10px; z-index: 401; display:none; }
    .status.show { display:block; }
    .status .msg { background: rgba(255,80,80,.1); color:#ff9a9a; border:1px solid rgba(255,80,80,.35); padding:6px 10px; border-radius:8px; }
    .credit { position: absolute; bottom: 8px; right: 10px; z-index: 400; background: rgba(20,24,28,.85); color:#a8b3bf; padding: 4px 8px; border-radius: 8px; font: 12px/1.2 system-ui; }
    .credit a { color:#8ab4f8; text-decoration:none; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive map of US time zones with live daylight overlay"></div>
  <div class="credit">Built with <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a></div>
  <div id="status" class="status" aria-live="polite"><div class="msg" id="statusMsg"></div></div>

  <!-- Leaflet JS loader with fallbacks -->
  <script>
    (function loadLeafletSeq() {
      const sources = [
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js",
        "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      ];
      let i = 0;
      function next() {
        if (window.L && typeof L.map === "function") return initApp();
        if (i >= sources.length) return showStatus("Could not load Leaflet from any CDN.", true);
        const s = document.createElement("script");
        s.src = sources[i++];
        s.onload = () => initApp();
        s.onerror = () => next();
        document.head.appendChild(s);
      }
      next();
    })();

    function showStatus(msg, isError) {
      const box = document.getElementById("status");
      const msgEl = document.getElementById("statusMsg");
      msgEl.textContent = msg;
      box.className = "status show";
      if (!isError) {
        msgEl.style.background = "rgba(80,180,255,.1)";
        msgEl.style.color = "#a8d1ff";
        msgEl.style.borderColor = "rgba(80,180,255,.35)";
      }
    }

    function initApp() {
      // ---------- Base map & fail-safe basemap cycle ----------
      const map = L.map('map', { zoomControl: true, worldCopyJump: true });

      // 4 reliable basemaps (rotate if one fails)
      const PROVIDERS = [
        { key:"OSM Light", layer: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 7, minZoom: 2, attribution: '&copy; OpenStreetMap' }) },
        { key:"Esri Light Gray", layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 7, minZoom: 2, attribution: 'Tiles &copy; Esri' }) },
        { key:"Carto Light", layer: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 7, minZoom: 2, subdomains:'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' }) },
        { key:"Esri Dark Gray", layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 7, minZoom: 2, attribution: 'Tiles &copy; Esri' }) }
      ];

      let activeIdx = 0;
      function useProvider(idx, reason) {
        // Remove all
        PROVIDERS.forEach(p => map.removeLayer(p.layer));
        activeIdx = idx;
        const prov = PROVIDERS[idx];
        prov.layer.addTo(map);

        // Watchdog: if tiles don't load or error, switch to next provider
        let loaded = 0, errors = 0;
        const onLoad = () => loaded++;
        const onErr = () => { errors++; if (errors >= 2) fallback("tile errors"); };
        function fallback(cause) {
          prov.layer.off('tileload', onLoad).off('tileerror', onErr);
          const nextIdx = (idx + 1) % PROVIDERS.length;
          if (nextIdx === idx) return showStatus("All basemaps blocked. Check network/ad-block.", true);
          showStatus(`Switched basemap → ${PROVIDERS[nextIdx].key} (${cause})`);
          useProvider(nextIdx, cause);
        }
        prov.layer.on('tileload', onLoad);
        prov.layer.on('tileerror', onErr);
        // If basically nothing loaded after 2s, fallback
        setTimeout(() => { if (loaded < 2) fallback("no tiles loaded"); }, 2000);
      }

      // Start on the safest (OSM Light)
      useProvider(0);

      map.setView([39.5, -98.35], 4); // USA center

      // ---------- Time zone polygons (clean rectangular bands) ----------
      function rectPoly(west, east, south, north) {
        return [ [south, west], [south, east], [north, east], [north, west], [south, west] ];
      }
      const SOUTH = 24.0, NORTH = 49.5; // CONUS band
      const zones = [
        { key: 'HST', name: 'Hawaii–Aleutian', tz: 'Pacific/Honolulu', color: '#a6cee3', poly: rectPoly(-161.0, -154.5, 18.5, 22.7) },
        { key: 'AKST', name: 'Alaska', tz: 'America/Anchorage', color: '#b2df8a', poly: rectPoly(-170.0, -141.0, 51.0, 71.5) },
        { key: 'PT',  name: 'Pacific', tz: 'America/Los_Angeles', color: '#fb9a99', poly: rectPoly(-125.0, -113.9, SOUTH, NORTH) },
        { key: 'MT',  name: 'Mountain', tz: 'America/Denver', color: '#fdbf6f', poly: rectPoly(-114.0, -103.5, SOUTH, NORTH) },
        { key: 'CT',  name: 'Central', tz: 'America/Chicago', color: '#cab2d6', poly: rectPoly(-103.5, -90.5,  SOUTH, NORTH) },
        { key: 'ET',  name: 'Eastern', tz: 'America/New_York', color: '#ffff99', poly: rectPoly(-90.5,  -66.9,  SOUTH, NORTH) }
      ];

      const tzLayer = L.layerGroup();
      zones.forEach(z => {
        const g = L.polygon(z.poly, { color: '#9aa4ad', weight: 1, opacity: 0.6, fillColor: z.color, fillOpacity: 0.28 }).addTo(tzLayer);
        g.bindTooltip(`<b>${z.name}</b><br>${z.key} — ${z.tz}`, { sticky: true });
      });
      tzLayer.addTo(map);

      const group = L.featureGroup([
        L.polygon(zones[2].poly), L.polygon(zones[3].poly),
        L.polygon(zones[4].poly), L.polygon(zones[5].poly),
        L.polygon(zones[1].poly), L.polygon(zones[0].poly)
      ]);
      map.fitBounds(group.getBounds().pad(0.15));

      // ---------- Live clocks ----------
      const clock = L.control({ position: 'topright' });
      clock.onAdd = function() {
        const div = L.DomUtil.create('div', 'panel clock');
        div.innerHTML = `
          <h4>Current Time</h4>
          <div class="row"><span>ET</span><span id="tET">—</span></div>
          <div class="row"><span>CT</span><span id="tCT">—</span></div>
          <div class="row"><span>MT</span><span id="tMT">—</span></div>
          <div class="row"><span>PT</span><span id="tPT">—</span></div>
          <div class="row"><span>AK</span><span id="tAK">—</span></div>
          <div class="row"><span>HI</span><span id="tHI">—</span></div>
        `;
        return div;
      };
      clock.addTo(map);

      function fmt(tz) {
        try {
          return new Date().toLocaleString(undefined, { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        } catch(e) { return '—'; }
      }
      function tick() {
        document.getElementById('tET').textContent = fmt('America/New_York');
        document.getElementById('tCT').textContent = fmt('America/Chicago');
        document.getElementById('tMT').textContent = fmt('America/Denver');
        document.getElementById('tPT').textContent = fmt('America/Los_Angeles');
        document.getElementById('tAK').textContent = fmt('America/Anchorage');
        document.getElementById('tHI').textContent = fmt('Pacific/Honolulu');
      }
      tick(); setInterval(tick, 1000);

      // ---------- Legend ----------
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'panel legend');
        div.innerHTML = `
          <h4>US Time Zones</h4>
          ${zones.map(z => `<div class="row"><span class="chip" style="background:${z.color}"></span> ${z.name} (${z.key})</div>`).join('')}
          <div class="row" style="margin-top:.35rem"><span class="chip" style="background:#000; opacity:.6"></span> Nighttime (dynamic)</div>
        `;
        return div;
      };
      legend.addTo(map);

      // ---------- Controls (layers + basemap selector) ----------
      const toggle = L.control({ position: 'topleft' });
      toggle.onAdd = function() {
        const div = L.DomUtil.create('div', 'panel toggle');
        div.innerHTML = `
          <div style="margin-bottom:.3rem; font-weight:600; opacity:.9">Layers</div>
          <label><input type="checkbox" id="cbZones" checked> Time Zones</label>
          <label><input type="checkbox" id="cbDaylight" checked> Daylight</label>
          <hr style="border:none;border-top:1px solid rgba(255,255,255,.1); margin:.4rem 0" />
          <div style="margin-bottom:.2rem; opacity:.8">Basemap</div>
          <label><input type="radio" name="bm" id="bm0" checked> OSM Light</label>
          <label><input type="radio" name="bm" id="bm1"> Esri Light Gray</label>
          <label><input type="radio" name="bm" id="bm2"> Carto Light</label>
          <label><input type="radio" name="bm" id="bm3"> Esri Dark Gray</label>
        `;
        return div;
      };
      toggle.addTo(map);

      // Wire up layer toggles
      setTimeout(() => {
        const cbZones = document.getElementById('cbZones');
        const cbDay = document.getElementById('cbDaylight');
        cbZones.addEventListener('change', () => { if (cbZones.checked) tzLayer.addTo(map); else map.removeLayer(tzLayer); });
        // Basemap radios
        [...Array(4).keys()].forEach(idx => {
          const el = document.getElementById(`bm${idx}`);
          el.addEventListener('change', () => {
            if (el.checked) useProvider(idx);
          });
        });
        // Daylight wired below after plugin attempt
      }, 0);

      // ---------- Day/Night Terminator (best effort; map still works if blocked) ----------
      (function loadTerminator() {
        const srcs = [
          "https://unpkg.com/@joergdietrich/leaflet.terminator",
          "https://cdn.jsdelivr.net/npm/@joergdietrich/leaflet.terminator/L.Terminator.js"
        ];
        let k = 0, done = false;
        function tryInit() {
          if (typeof L.terminator === 'function') {
            const terminator = L.terminator({ fillOpacity: 0.6, color: '#000', fillColor: '#000', weight: 0, interactive: false });
            terminator.addTo(map);
            setInterval(() => terminator.setTime(), 60 * 1000);
            const cbDay = document.getElementById('cbDaylight');
            cbDay.addEventListener('change', () => {
              if (cbDay.checked) terminator.addTo(map); else map.removeLayer(terminator);
            });
            return true;
          }
          return false;
        }
        function next() {
          if (done) return;
          if (tryInit()) { done = true; return showStatus("Daylight overlay active"); }
          if (k >= srcs.length) { 
            const cbDay = document.getElementById('cbDaylight');
            cbDay.checked = false; cbDay.disabled = true;
            return showStatus("Daylight overlay unavailable (plugin blocked).", true);
          }
          const s = document.createElement("script");
          s.src = srcs[k++]; s.onload = () => { if (!tryInit()) next(); };
          s.onerror = () => next();
          document.head.appendChild(s);
        }
        next();
      })();

      // ---------- Safety: fix size after first paint ----------
      setTimeout(() => map.invalidateSize(), 300);
    }

    // Global runtime error catcher
    window.addEventListener('error', (e) => showStatus(`Runtime error: ${e.message}`, true));
    window.addEventListener('unhandledrejection', (e) => showStatus(`Promise error: ${(e.reason && e.reason.message) || e.reason}`, true));
  </script>
</body>
</html>
